services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jobengine
      POSTGRES_PASSWORD: jobengine
      POSTGRES_DB: jobengine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobengine -d jobengine"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
      - ./evals:/app/evals
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "src.main"]

  worker:
    build:
      context: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
      - ./evals:/app/evals
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "src.worker"]

  scheduler:
    build:
      context: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "src.scheduler"]

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
